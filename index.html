<!--
  MEADOW MAGIC v0.3
  Plain HTML/CSS/JS. No dependencies, no build step. Double-click to play.

  CONTROLS (left-hand friendly, one button):
    Move:   A / D,  Arrow keys,  Xbox left stick,  or hold the on-screen ◀ ▶
    Act:    Space,  Xbox A button, or tap the big on-screen ★
    Exit rooms: B button, Esc, or the on-screen ✕

  SCENES: title -> meadow <-> cottage <-> dollhouse (tiny mini-game!)
                       meadow <-> house (bedroom / kitchen / living room)
                       meadow <-> paint (Maya's studio)
                       meadow <-> pond (splash the ducks!) / garden gate
                                 (wake the flowers, ring the bell)
  ZONES (meadow, left to right): Cozy Cottage, Flower Garden, Painting Corner,
                                Word Stones, Bramble's Hill

  DRESS-UP: 23 wearable pieces (3 dresses + 20 accessories). The closet
  starts small and GROWS every time Madison does something lovely --
  growing flowers, splashing ducks, stacking blocks, sipping tea...
  Open the dress-up box (title screen, or ★ at the doll-room wardrobe)
  to see everything collected in a tidy grid and tap any piece to wear
  it. Progress saves automatically (localStorage "mmm_save").

  MUSIC: gentle, original nursery loops (including the public-domain
  "Twinkle Twinkle / ABC" tune) are generated live with the Web Audio
  API -- no files, no licensing. It starts on the first tap and ducks
  under the narrator. Grown-ups: long-press the ♪ button (or press M)
  to toggle it.

  VOICE: every line lives in the VOICE_TEXT manifest (marked with
  // === VOICE MANIFEST START/END ===). The game plays audio/<key>.mp3
  if it exists, and falls back to browser speech otherwise. Regenerate
  the audio folder by editing VOICE_TEXT and running build-voice.py
  (needs Python + edge-tts: winget install python; pip install edge-tts).
-->

<script>
"use strict";
/* ================= SETUP ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
const WORLD_W = 3900;
const GROUND_Y = 468;

/* ================= AUDIO ================= */
let audioCtx = null;
function blip(freq = 660, delay = 0, dur = 0.18) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const happySound = () => { blip(523); blip(659, 0.1); blip(784, 0.2); blip(1047, 0.3); };

/* ================= BACKGROUND MUSIC =================
   Gentle, ORIGINAL nursery music generated live with the Web Audio API — no audio
   files, no licensing, a few hundred bytes of code. A soft marimba-ish melody over
   a warm walking bass with the faintest shaker and a barely-there kick, at a calm
   toddler tempo. Loops include the public-domain "Twinkle Twinkle / ABC" tune plus
   two melodies written for the meadow. It starts on the first tap/keypress (browsers
   only allow audio after a gesture) and ducks softly whenever the narrator speaks.
   Grown-ups toggle it with the ♪ button (long-press) or the M key. */
let musicOn = (() => { try { const v = localStorage.getItem('mmm_music'); return v === null ? true : v === '1'; } catch (e) { return true; } })();
let musicGain = null, musicNoiseBuf = null;
let musicNext = 0, musicStep = 0, musicMelo = 0, musicTimer = 0, musicStarted = false;
const mfreq = m => 440 * Math.pow(2, (m - 69) / 12);
const MELODIES = [
  { name: 'Twinkle', tempo: 0.52, bass: [48, 55], seq: [           // "Twinkle Twinkle / ABC" — traditional, public domain
    [60,1],[60,1],[67,1],[67,1],[69,1],[69,1],[67,2],
    [65,1],[65,1],[64,1],[64,1],[62,1],[62,1],[60,2],
    [67,1],[67,1],[65,1],[65,1],[64,1],[64,1],[62,2],
    [67,1],[67,1],[65,1],[65,1],[64,1],[64,1],[62,2],
    [60,1],[60,1],[67,1],[67,1],[69,1],[69,1],[67,2],
    [65,1],[65,1],[64,1],[64,1],[62,1],[62,1],[60,2] ] },
  { name: 'Meadow', tempo: 0.58, bass: [45, 52], seq: [            // soft original lullaby
    [69,1],[72,1],[71,1],[69,1],[67,2],[64,1],[67,1],
    [69,2],[0,1],[69,1],[71,1],[74,1],[72,1],[71,1],
    [69,2],[0,1],[67,1],[69,1],[71,1],[69,1],[67,1],
    [64,2],[0,1],[62,1],[64,1],[67,1],[64,1],[62,1],[60,4] ] },
  { name: 'Pond', tempo: 0.46, bass: [41, 48], seq: [              // bouncy little pond tune
    [60,1],[64,1],[67,1],[64,1],[69,1],[67,1],[64,2],
    [65,1],[64,1],[62,1],[64,1],[60,2],[0,1],[60,1],
    [64,1],[67,1],[72,1],[67,1],[69,1],[67,1],[64,2],
    [62,1],[64,1],[65,1],[67,1],[60,4] ] },
];
function mNoiseBuffer() {
  if (musicNoiseBuf) return musicNoiseBuf;
  const n = Math.floor(audioCtx.sampleRate * 0.2);
  const b = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  return (musicNoiseBuf = b);
}
function mNote(freq, t, dur, type, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + dur + 0.05);
}
function mShaker(t) {
  const s = audioCtx.createBufferSource(); s.buffer = mNoiseBuffer();
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  s.connect(f); f.connect(g); g.connect(musicGain); s.start(t); s.stop(t + 0.08);
}
function mKick(t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
  g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.16);
}
function musicSchedule() {   // look-ahead scheduler keeps the timing rock smooth
  if (!audioCtx || !musicOn) return;
  const mel = MELODIES[musicMelo], tempo = mel.tempo;
  if (currentVoice && currentVoice.paused === false) musicGain.gain.value = 0.06;   // duck under the narrator
  else musicGain.gain.value = 0.16;
  const look = audioCtx.currentTime + 0.25;
  let guard = 0;
  while (musicNext < look && guard++ < 64) {
    const ev = mel.seq[musicStep % mel.seq.length], t = musicNext, beats = ev[1];
    if (ev[0] > 0) mNote(mfreq(ev[0]), t, Math.min(beats * tempo * 0.95, 1.4), 'triangle', 0.16);
    mNote(mfreq(mel.bass[musicStep % 2]), t, tempo * 0.9, 'sine', 0.09);   // walking bass
    mShaker(t + tempo / 2);                                              // soft off-beat
    if (musicStep % 4 === 0) mKick(t);
    musicNext += beats * tempo;
    musicStep++;
  }
}
function startMusic() {
  if (musicStarted || !musicOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!musicGain) { musicGain = audioCtx.createGain(); musicGain.gain.value = 0.16; musicGain.connect(audioCtx.destination); }
    musicNext = audioCtx.currentTime + 0.1; musicStep = 0;
    musicMelo = (Math.random() * MELODIES.length) | 0;
    musicStarted = true;
    if (musicTimer) clearInterval(musicTimer);
    musicTimer = setInterval(() => { try { musicSchedule(); } catch (e) {} }, 60);
  } catch (e) {}
}
function stopMusic() { musicStarted = false; if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
function toggleMusic() {
  musicOn = !musicOn;
  try { localStorage.setItem('mmm_music', musicOn ? '1' : '0'); } catch (e) {}
  const b = document.getElementById('music-btn'); if (b) b.textContent = musicOn ? '♪' : '∙';
  if (musicOn) { musicStarted = false; startMusic(); } else stopMusic();
}

      if (lang.startsWith('en-GB')) s += 4;
      else if (lang.startsWith('en')) s += 2;
      if (/david|mark|male/.test(n)) s -= 3;

// Grown-up save (2026-10-03): renders just the paper — not the UI — to a 2x PNG,
// downloads it, and keeps a small gallery (max 8) in localStorage. Quiet by design:
// a little toast and a soft blip, no fanfare narration. Never blocks play.
function savePainting() {
  if (scene !== 'paint') return;
  if (!paint.dabs.length) { paint.toast = 'Paint something first!'; paint.toastT = 2.2; blip(330); return; }
  const S = 2, c = document.createElement('canvas');
  c.width = 560 * S; c.height = 360 * S;
  const g = c.getContext('2d');
  g.fillStyle = '#fffdf6'; g.fillRect(0, 0, c.width, c.height);
  g.save(); g.scale(S, S); g.translate(-200, -90);
  const circ = (x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  for (const d of paint.dabs) {
    g.fillStyle = d.c;
    for (let p = 0; p < d.petals; p++) { const a = p * Math.PI * 2 / d.petals;
      circ(d.x + Math.cos(a) * d.r * 0.62, d.y + Math.sin(a) * d.r * 0.62, d.r * 0.42); }
    g.fillStyle = '#fff'; circ(d.x, d.y, d.r * 0.3);
  }
  g.restore();
  const url = c.toDataURL('image/png');
  try {
    const gal = JSON.parse(localStorage.getItem('meadowPaintings') || '[]');
    gal.push(url); while (gal.length > 8) gal.shift();
    localStorage.setItem('meadowPaintings', JSON.stringify(gal));
  } catch (e) { /* private mode etc. — the download below still works */ }
  const a = document.createElement('a');
  a.download = 'madisons-painting.png'; a.href = url;
  document.body.appendChild(a); a.click(); a.remove();
  paint.toast = 'Saved ✓'; paint.toastT = 2.2; blip(880);
}

/* ================= DRAW HELPERS ================= */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function softLight(x, y, r, a = 0.3) {                       // soft top-left highlight for 2.5D shading
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,' + a + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function star(x, y, r, ir) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? ir : r;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fill();
}
function pill(cx, y, text, font) {
  ctx.font = font || 'bold 22px "Comic Sans MS",sans-serif';
  const w = ctx.measureText(text).width + 36;
  ctx.fillStyle = 'rgba(20,30,50,.55)'; rr(cx - w / 2, y - 24, w, 44, 22); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, y);
}
function outlineText(text, x, y, font, fill, stroke, lw) {
  ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = lw || 6; ctx.strokeStyle = stroke || 'rgba(60,40,20,.55)';
  ctx.strokeText(text, x, y); ctx.fillStyle = fill || '#fff'; ctx.fillText(text, x, y);
}

/* ================= SKY, HILLS, GROUND ================= */
function drawSky(time) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#5fb8f2'); g.addColorStop(0.55, '#a5defa');
  g.addColorStop(0.8, '#e3f7ff'); g.addColorStop(1, '#fff4c9');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sx = 830, sy = 88;                                     // sun + rotating rays
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(time * 0.15);
  ctx.strokeStyle = 'rgba(255,214,90,.75)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 60, Math.sin(a) * 60);
    ctx.lineTo(Math.cos(a) * 80, Math.sin(a) * 80); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,236,140,.35)'; circle(sx, sy, 72);
  ctx.fillStyle = '#ffe98a'; circle(sx, sy, 48);
  for (const c of clouds) {                                    // drifting clouds, parallax
    let cx = (c.x - camX * 0.15 + time * 7) % (WORLD_W + 400);
    if (cx < 0) cx += WORLD_W + 400; cx -= 200;
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ell(cx, c.y, 48 * c.s, 22 * c.s); ell(cx + 36 * c.s, c.y + 5 * c.s, 34 * c.s, 17 * c.s);
    ell(cx - 38 * c.s, c.y + 6 * c.s, 32 * c.s, 16 * c.s);
    ctx.fillStyle = 'rgba(200,225,245,.6)'; ell(cx, c.y + 12 * c.s, 44 * c.s, 12 * c.s);
  }
  ctx.strokeStyle = '#4a6a8a'; ctx.lineWidth = 3; ctx.lineCap = 'round';  // birds
  for (const b of birds) {
    const f = Math.sin(b.ph) * 7;
    ctx.beginPath();
    ctx.moveTo(b.x - 12, b.y); ctx.quadraticCurveTo(b.x - 6, b.y - 8 - f, b.x, b.y);
    ctx.quadraticCurveTo(b.x + 6, b.y - 8 - f, b.x + 12, b.y);
    ctx.stroke();
  }
}
function drawCloud(time, cx, cy, s, seed) {                  // standalone puffy cloud
  const wob = Math.sin(time * 0.8 + seed * 2) * 4;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ell(cx, cy + wob, 48 * s, 22 * s);
  ell(cx + 36 * s, cy + 5 * s + wob, 34 * s, 17 * s);
  ell(cx - 38 * s, cy + 6 * s + wob, 32 * s, 16 * s);
  ctx.fillStyle = 'rgba(200,225,245,.6)';
  ell(cx, cy + 12 * s + wob, 44 * s, 12 * s);
}
function drawHills() {
  ctx.fillStyle = '#c9b6ef';
  ell(400 - camX * 0.3, GROUND_Y + 80, 480, 190); ell(1450 - camX * 0.3, GROUND_Y + 90, 540, 210);
  ell(2500 - camX * 0.3, GROUND_Y + 80, 470, 180);
  ctx.fillStyle = '#a5e3a5';
  ell(150 - camX * 0.5, GROUND_Y + 90, 430, 150); ell(1100 - camX * 0.5, GROUND_Y + 95, 520, 165);
  ell(2050 - camX * 0.5, GROUND_Y + 90, 480, 155); ell(2950 - camX * 0.5, GROUND_Y + 95, 420, 150);
}
const TREES = [620, 1900, 2560, 3320, 3640];
function drawCarriage(time) {                                  // horse-drawn carriage, background cameo
  if (!carriage) return;

  circle(68, -60, 11);                                        // head

  ctx.beginPath(); ctx.moveTo(62, -68); ctx.lineTo(66, -78); ctx.lineTo(70, -68); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7a4a28'; ell(56, -58, 6, 12);             // mane

  ctx.fillStyle = '#3a2a1a'; circle(71, -62, 1.8);             // eye
  ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = 5;              // shaft
  ctx.beginPath(); ctx.moveTo(8, -36); ctx.lineTo(-24, -30); ctx.stroke();
  ctx.fillStyle = '#ff9f5a';                                  // pumpkin carriage body
  ell(-58, -44, 36, 32);
  ctx.strokeStyle = '#e07f3a'; ctx.lineWidth = 3;              // pumpkin ribs
  for (let r = -1; r <= 1; r++) {
    ctx.beginPath(); ctx.ellipse(-58 + r * 12, -44, 10, 30, 0, -0.6, 0.6); ctx.stroke();

/* ================= UPDATE ================= */
let lastT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t; update(dt, t / 1000); draw(t / 1000);
  requestAnimationFrame(loop);
}
function updateAmbient(dt, time) {
  birdTimer -= dt;
  if (birdTimer <= 0) {
    birds.push({ x: W + 50, y: 60 + Math.random() * 130, vx: -(45 + Math.random() * 45), ph: Math.random() * 7 });
    birdTimer = 5 + Math.random() * 7;
  }
  for (const b of birds) { b.x += b.vx * dt; b.ph += dt * 9; }
  birds = birds.filter(b => b.x > -60);
  carriageTimer -= dt;                                        // horse-drawn carriage, background cameo
  if (carriageTimer <= 0 && scene === 'meadow' && !carriage) {
    carriage = { x: camX * 0.6 - 280, speed: 55 + Math.random() * 25, ph: Math.random() * 7, rot: 0 };
    carriageTimer = 28 + Math.random() * 25;
  }
  if (carriage) {
    carriage.x += carriage.speed * dt; carriage.ph += dt * 6;
    carriage.rot += carriage.speed * dt / 14;
    if (carriage.x - camX * 0.6 > W + 280) carriage = null;
  }
  for (const l of leaves) {
    l.x += l.vx * dt; l.y += Math.sin(time * 1.4 + l.ph) * 24 * dt; l.rot += l.vr * dt;
    if (l.x > W + 30) { l.x = -30; l.y = Math.random() * H; }
  }
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; }
  particles = particles.filter(p => p.t < p.life);
  if (banner) { banner.t += dt; if (banner.t > 2.4) banner = null; }
}
function update(dt, time) {
  updateAmbient(dt, time);
  if (player.twirl > 0) player.twirl -= dt;
  if (player.squash > 0) player.squash -= dt;
  dragonT += dt;
  if (dragonHop > 0) dragonHop -= dt;
  dragonBlink -= dt; if (dragonBlink < -0.15) dragonBlink = 2.5 + Math.random() * 2.5;
  if (ward.open) {                                        // dress-up inventory is a modal
    updateWardrobe(dt);
  }
  else if (invite) {                                        // modal: grown-up activity invitation
    if (actionEdge()) confirmInvite();                // ★ = the grown-up confirms "We did it!"
    else if (exitEdge()) skipInvite();                // ✕ = keep playing; the outfit simply waits
  }
  else if (scene === 'title') updateTitle(dt, time);
  else if (scene === 'meadow') updateMeadow(dt, time);
  else if (scene === 'house') updateHouse(dt, time);
  else if (scene === 'dollroom') updateDollRoom(dt, time);
  else if (scene === 'dollhouse') updateDollhouse(dt, time);
  else if (scene === 'paint') updatePaint(dt, time);
  else if (scene === 'pond') updatePond(dt, time);
  else if (scene === 'garden') updateGarden(dt, time);
  else if (scene === 'ispy') updateIspy(dt, time);
  else if (scene === 'flight') updateFlight(dt, time);
  // warm scene-transition fade: swap the world at the halfway point
  if (fadeT >= 0) {
    fadeT += dt / 1.15;
    if (fadeT >= 0.5 && fadeMid) { const m = fadeMid; fadeMid = null; m(); }
    if (fadeT >= 1) { fadeT = -1; if (fadeEnd) { const e = fadeEnd; fadeEnd = null; e(); } }
  }
}
function movePlayer(dt, minX, maxX) {
  const m = moveInput();
  player.speed += ((m * 260) - player.speed) * Math.min(1, dt * 8);
  player.x = Math.max(minX, Math.min(maxX, player.x + player.speed * dt));
  if (Math.abs(player.speed) > 20) { player.face = player.speed > 0 ? 1 : -1; player.bob += dt * 10; }
}
function updateTitle(dt) {
  titleCooldown -= dt;
  if (titleTapCd > 0) titleTapCd -= dt;
  const m = moveInput();
  if (titleCooldown <= 0 && m !== 0) {
    if (titleStep === 0) charIndex = (charIndex + (m > 0 ? 1 : CHARACTERS.length - 1)) % CHARACTERS.length;
    else if (titleStep === 1) colorIndex = (colorIndex + (m > 0 ? 1 : COLORS.length - 1)) % COLORS.length;
    else { const n = lookOptions().length; titleLookIdx = (titleLookIdx + (m > 0 ? 1 : n - 1)) % n; }
    titleCooldown = 0.28; blip(600);
  }
  if (actionEdge()) {
    preloadVoices();                                    // user gesture unlocks audio
    if (titleStep === 0) { titleStep = 1; titleSaid = false; blip(784); }
    else if (titleStep === 1) {
      if (lookOptions().length > 1) { titleStep = 2; titleSaid = false; blip(784); openWardrobe('title'); }
      else beginMeadow();
    }
    else { look = lookOptions()[ward.sel]; saveProgress(); beginMeadow(); }
  }
  // P1.5: a mis-press isn't a trap — Esc / gamepad B steps back on the title screens.
  if (exitEdge() && titleStep > 0) { titleStep--; titleSaid = false; blip(392); }
}

function updateMeadow(dt) {

        s.bloomed = true; s.pop = 0.8;

        blip(660); setTimeout(() => blip(990), 120);

  for (let i = 0; i < 3; i++) {                                         // birds keeping pace
    const bx = W - ((flightT * 55 + i * 260) % (W + 200)) + 100, by = 200 + i * 60 + Math.sin(time * 2 + i) * 12;
    ctx.strokeStyle = '#5a6a8a'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    const w = Math.sin(time * 9 + i * 2) * 9;
    ctx.beginPath(); ctx.moveTo(bx - 14, by + w); ctx.quadraticCurveTo(bx, by - 5, bx + 14, by + w); ctx.stroke();
  }
  ctx.fillStyle = '#9ed69e';                                             // patchwork fields far below
  ctx.fillRect(0, H - 90, W, 90);
  ctx.fillStyle = '#8acb8a';
  for (let i = 0; i < 8; i++) ctx.fillRect(((i * 220 - flightT * 60) % (W + 220) + W + 220) % (W + 220) - 110, H - 90, 110, 90);
  const bob = Math.sin(time * 2.2) * 10, fx = 480, fy = 300 + bob;      // Bramble + rider
  ctx.save(); ctx.translate(fx, fy);
  const flap = Math.sin(time * 5) * 0.5;
  ctx.fillStyle = '#7fd67f';                                            // wings
  for (const wd of [-1, 1]) {
    ctx.save(); ctx.rotate(wd * (0.5 + flap * 0.3));
    ctx.beginPath(); ctx.ellipse(wd * 55, -30, 46, 20, wd * 0.5, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#8fe08f'; ell(0, 0, 70, 44);                         // body
  circle(62, -28, 26);                                                  // head
  ctx.fillStyle = '#6fc06f';
  ctx.beginPath(); ctx.moveTo(48, -46); ctx.lineTo(54, -66); ctx.lineTo(62, -48); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(66, -48); ctx.lineTo(74, -66); ctx.lineTo(78, -46); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; circle(68, -32, 8); circle(56, -34, 8);
  ctx.fillStyle = '#3a2a1a'; circle(69, -31, 3.5); circle(57, -33, 3.5);
  ctx.strokeStyle = '#6fc06f'; ctx.lineWidth = 10; ctx.lineCap = 'round';// tail
  ctx.beginPath(); ctx.moveTo(-64, 6); ctx.quadraticCurveTo(-110, 10 + Math.sin(time * 3) * 8, -130, -6); ctx.stroke();
  drawCharacter(CHARACTERS[charIndex].id, colorIndex, 6, -72, 0.85, time, 1);         // Madison riding!
  ctx.restore();
  drawParticles();
  pill(W / 2, 560, '★  land whenever you like');
}

/* ================= MAIN DRAW ================= */
function draw(time) {
  ctx.clearRect(0, 0, W, H);
  if (scene === 'title') { drawTitle(time); if (ward.open) drawWardrobe(time); return; }
  if (scene === 'meadow') {
    drawSky(time); drawHills(); drawCarriage(time); drawTrees(time); drawGround(time);
    drawSign(300, 'Cozy Cottage'); drawSign(1020, 'Flower Garden'); drawSign(1650, 'Painting Corner');
    drawSign(2250, 'Word Stones'); drawSign(2750, "Bramble's Hill");
    drawSign(3150, 'Pond'); drawSign(3450, 'Garden Gate'); drawSign(3750, 'I Spy Hollow');
    drawCottage(); drawGarden(time); drawPaintCorner(); drawWordStones(time);
    drawDragonHill(); drawDragon(time); drawButterflies(time); drawMarble(time);
    drawPlayer(time); drawParticles(); drawLeaves(); drawForeground(time);
    drawHUD(time); drawPrompt(time); drawMarbleArrow(time);
  } else if (scene === 'house') {
    drawHouseScene(time); drawMabel(time); drawPlayer(time); drawParticles(); drawPrompt(time);
  } else if (scene === 'dollroom') {
    drawDollRoom(time);
    for (const d of DOLLS) drawDoll(d, time);
    drawPlayer(time); drawParticles(); drawPrompt(time);
  } else if (scene === 'dollhouse') {
    drawDollhouseScene(time); drawPlayer(time); drawParticles(); drawPrompt(time);
  } else if (scene === 'paint') {
    drawPaintScene(time); drawParticles();
  } else if (scene === 'pond') {
    drawPond(time);
  } else if (scene === 'garden') {
    drawFairyGarden(time);
  } else if (scene === 'ispy') {
    drawIspy(time);
  } else if (scene === 'flight') {
    drawFlight(time);
  }
  drawBanner();                     // zone names + accessory awards, in every scene
  if (ward.open) drawWardrobe(time);        // dress-up inventory (doll-room station)
  if (invite) drawInvite(time);            // full-screen grown-up activity invitation
  if (fadeT >= 0) {                        // warm cream transition veil (never black)
    const a = Math.sin(Math.PI * Math.min(1, fadeT));
    ctx.fillStyle = 'rgba(255,248,232,' + (a * 0.97).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
// Full-screen gentle invitation: the outfit is earned by moving with a grown-up.
// ★ = the grown-up confirms ("We did it!"). ✕ = keep playing; the outfit waits.
function drawInvite(time) {
  const okey = invite.outfit, outfit = OUTFITS[okey];
  ctx.fillStyle = 'rgba(45,50,90,.45)'; ctx.fillRect(0, 0, W, H);
  const bw = 760, bh = 470, bx = W / 2 - bw / 2, by = H / 2 - bh / 2;
  const float = Math.sin(time * 1.8) * 4;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(bx + 6, by + 12 + float, bw, bh, 40); ctx.fill();
  ctx.fillStyle = '#fffdf4'; rr(bx, by + float, bw, bh, 40); ctx.fill();
  ctx.strokeStyle = outfit.color; ctx.lineWidth = 6;
  rr(bx, by + float, bw, bh, 40); ctx.stroke();
  const savedLook = look; look = okey;
  drawCharacter(CHARACTERS[charIndex].id, colorIndex, W / 2, by + 118 + float, 1.0, time, 1);
  look = savedLook;
  outlineText('A challenge for you and a grown-up!', W / 2, by + 52 + float,
    'bold 34px "Comic Sans MS",sans-serif', '#5a4a8a', '#fff', 0);
  ctx.fillStyle = '#4a4468'; ctx.font = '26px "Comic Sans MS",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  wrapText(outfit.activity, W / 2, by + 216 + float, bw - 120, 34);
  outlineText('Then your ' + outfit.name + ' is yours!', W / 2, by + 302 + float,
    'bold 28px "Comic Sans MS",sans-serif', outfit.color, '#fff', 0);
  const btnW = 360, btnH = 64, btnX = W / 2 - btnW / 2, btnY = by + 336 + float;
  ctx.fillStyle = '#7bc96f'; rr(btnX, btnY, btnW, btnH, 32); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; rr(btnX, btnY, btnW, btnH, 32); ctx.stroke();
  outlineText('★  We did it!', W / 2, btnY + btnH / 2 + 1,
    'bold 30px "Comic Sans MS",sans-serif', '#fff', 'rgba(40,80,40,.45)', 6);
  ctx.fillStyle = '#8a86a8'; ctx.font = '22px "Comic Sans MS",sans-serif';
  ctx.fillText('✕  keep playing', W / 2, by + 436 + float);
}
function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  lines.push(line);
  const y0 = y - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => ctx.fillText(l, cx, y0 + i * lh));
}
requestAnimationFrame(loop);
</script>
